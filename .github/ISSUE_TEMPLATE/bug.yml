name: Bug
description: Something behaves differently from what the documents say.
labels: ["bug"]
body:
  - type: textarea
    id: log
    attributes:
      label: Redacted relevant sync-log lines
      description: "Start with the relevant warnings, errors, and final counters from `sync\\sync-log-<machine>.md`. Do not paste vault contents, credentials, employer data, runtime settings, or an unredacted full log."
      render: text
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and where the documents say so
      description: A file and line is ideal. If the documents are what is wrong, that is a bug too - arguably the worse kind.
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations: { required: true }
